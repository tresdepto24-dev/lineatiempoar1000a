<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR-1000-A // Línea de Tiempo, Scan y Latitud - VentaniYA</title>
    <style>
        :root {
            --quantum-glow: #00ffcc;
            --quantum-glow-dim: rgba(0, 255, 204, 0.4);
            --quantum-bg-darkest: #050a14;
            --quantum-panel-bg: rgba(10, 25, 35, 0.85);
            --text-bright: #e0fbfc;
            --alert-red: #ff3366;
        }

        body {
            background-color: var(--quantum-bg-darkest);
            color: var(--text-bright);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: var(--quantum-glow);
            text-shadow: 0 0 10px var(--quantum-glow-dim);
            letter-spacing: 2px;
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #88ccbb;
            font-size: 0.8rem;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            max-width: 900px;
            width: 100%;
        }

        .panel {
            background: var(--quantum-panel-bg);
            border: 1px solid var(--quantum-glow);
            box-shadow: 0 0 15px var(--quantum-glow-dim);
            border-radius: 6px;
            padding: 20px;
            width: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .controls {
            margin-bottom: 15px;
            text-align: center;
        }

        input[type="file"] {
            display: none;
        }

        .custom-file-upload {
            border: 1px solid var(--quantum-glow);
            display: inline-block;
            padding: 10px 20px;
            cursor: pointer;
            background: rgba(0, 255, 204, 0.1);
            color: var(--quantum-glow);
            font-weight: bold;
            border-radius: 4px;
            transition: all 0.3s;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        .custom-file-upload:hover {
            background: var(--quantum-glow);
            color: var(--quantum-bg-darkest);
            box-shadow: 0 0 10px var(--quantum-glow);
        }

        .canvas-container {
            position: relative;
            width: 100%;
            border: 1px dashed var(--quantum-glow);
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            margin-bottom: 15px;
        }

        canvas {
            max-width: 100%;
            height: auto;
            display: block;
        }

        .download-btn {
            background: var(--quantum-glow);
            color: var(--quantum-bg-darkest);
            border: none;
            padding: 10px 20px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 0.9rem;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s;
            box-shadow: 0 0 8px var(--quantum-glow-dim);
            display: none;
        }

        .download-btn:hover {
            background: #33ffcc;
            box-shadow: 0 0 15px var(--quantum-glow);
        }
    </style>
</head>
<body>

    <h1>AR-1000-A // LÍNEA DE TIEMPO, SCAN Y LATITUD</h1>
    <div class="subtitle">VentaniYA - Sistema Cuántico de Estampado de Datos</div>

    <div class="main-container">
        <div class="panel">
            <div class="controls">
                <label for="fileInput" class="custom-file-upload">
                    📂 Cargar Archivo para Estampado
                </label>
                <input type="file" id="fileInput" accept="image/*">
            </div>

            <div class="canvas-container">
                <canvas id="canvas"></canvas>
            </div>

            <button id="btnDescarga" class="download-btn">⬇ Descargar Imagen Estampada</button>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const btnDescarga = document.getElementById('btnDescarga');

        let imagenCargada = new Image();

        fileInput.addEventListener('change', function(e) {
            const archivo = e.target.files[0];
            if (!archivo) return;

            const tamanoBytes = archivo.size;
            const tamanoKB = (tamanoBytes / 1024).toFixed(2);
            const nombreArchivo = archivo.name;

            const lector = new FileReader();
            lector.onload = function(event) {
                imagenCargada.onload = function() {
                    const imgW = imagenCargada.width;
                    const imgH = imagenCargada.height;

                    // Espacio extra abajo para los paneles de datos
                    const alturaExtra = 130;
                    canvas.width = imgW;
                    canvas.height = imgH + alturaExtra;

                    // 1. Dibujar imagen original
                    ctx.drawImage(imagenCargada, 0, 0);

                    // 2. Fondo del panel inferior de datos
                    ctx.fillStyle = "rgba(5, 10, 20, 0.9)";
                    ctx.fillRect(0, imgH, imgW, alturaExtra);

                    // Línea divisoria brillante
                    ctx.strokeStyle = "#00ffcc";
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(0, imgH);
                    ctx.lineTo(imgW, imgH);
                    ctx.stroke();

                    // 3. Estampado de Línea de Tiempo, Scan y Latitud
                    ctx.fillStyle = "#ff3366";
                    ctx.font = "bold 11px 'Courier New'";
                    ctx.fillText(">> LÍNEA DE TIEMPO: T-00:01:24 // SCAN ACTIVO", 20, imgH + 25);

                    ctx.fillStyle = "#e0fbfc";
                    ctx.font = "10px 'Courier New'";
                    ctx.fillText(`• Archivo: ${nombreArchivo}`, 20, imgH + 48);
                    ctx.fillText(`• Peso: ${tamanoBytes} BYTES (${tamanoKB} KB)`, 20, imgH + 68);
                    ctx.fillText(`• Resolución: ${imgW}x${imgH} px`, 20, imgH + 88);

                    // Obtener fecha y hora real con milisegundos
                    const now = new Date();
                    const fechaStr = now.toLocaleDateString() + " - " + now.toTimeString().split(' ')[0] + "." + String(now.getMilliseconds()).padStart(3, '0');
                    const hashSimulado = "0x" + Math.random().toString(16).substring(2, 10).toUpperCase();

                    ctx.fillText(`• Sello Temporal: ${fechaStr}`, 320, imgH + 48);
                    ctx.fillText(`• Latitud / Ubicación: 38.719° S // 62.272° W`, 320, imgH + 68);
                    ctx.fillText(`• Estado del Scan: ÓPTICA ESTABLE`, 320, imgH + 88);

                    ctx.fillStyle = "#00ffcc";
                    ctx.font = "bold 10px 'Courier New'";
                    ctx.fillText(`HASH: ${hashSimulado} // SISTEMA AR-1000-A`, 20, imgH + 112);

                    btnDescarga.style.display = 'block';
                }
                imagenCargada.src = event.target.result;
            }
            lector.readAsDataURL(archivo);
        });

        btnDescarga.addEventListener('click', function() {
            const enlace = document.createElement('a');
            enlace.download = 'AR-1000-A_LineaTiempo_Latitud.png';
            enlace.href = canvas.toDataURL('image/png');
            enlace.click();
        });
    </script>
</body>
</html>
